<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container-fluid p-0 overflow-hidden custom-section vh-100 d-flex flex-column">
    <div class="row">
      <div class="col-12 d-flex p-3 align-items-center" style="justify-content: space-between;">
        <div class="left mx-5">
          <img style="width: 80px;" src="img/japaneselogo.png">
        </div>
        <div class="right d-flex text-white gap-5 fs-5 mx-5">
          <div class="div">Home</div>
          <div class="div">Characters</div>
          <div class="div">Styles</div>
          <div class="div">Story</div>
        </div>
      </div>
    </div>

    <div class="bottom-container">
      <div class="row d-flex align-items-center p-3">
        <div class="col-6 div text-white desc">
          <div class="div" style="font-size: 24px;">
            <h2>EXPLORE THE WORLD OF DEMON SLAYER</h2>
          </div>
          <div class="p" style="opacity: 80%;">
            <p>where courage, bonds, and the battle between humans and<br>demons shape an unforgettable journey.
              Discover
              legendary<br>swordsmen, powerful breathing styles, and the stories that<br> ignite the flames of
              determination.</p>
          </div>
        </div>
        <div class="sticker col-6"><img src="img/Sticker 1.png" alt="sticker"></div>
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
