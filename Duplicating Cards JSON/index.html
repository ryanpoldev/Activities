<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demon Slayer | Hashira Information</title>
  <link rel="icon" type="image/png" href="img/Sticker 1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>
  <!--Hero & Nav-->
  <div class="container-fluid p-0 overflow-hidden">
    <div class="row">
      <div class="col-12">
        <div class="card hero-section rounded-0" style="height: 400px; border-style: none;">

          <div class="navbar d-flex justify-content-between p-0 mx-5 text-white">
            <img src="img/japaneselogo.png" alt="japaneselogo" style="width: 78px; height: 80px;">
            <div class="nav-item align-items-center fs-5 fw-regular"> About

            </div>
          </div>

          <div class="container text-white text-center">
            <div class="div" style="margin-top: -20px;"><img src="img/Sticker 1.png" alt="sticker"
                style="width: 160px;"></div>
            <div class="div">
              <h1 class="fw-bold" style="font-size: 76px;">HASHIRA</h1>
            </div>
            <div class="div">
              <p style="font-size: 20px;">The Hashira (柱はしら Hashira?, lit. Pillars) are the highest-ranking <a
                  href="https://kimetsu-no-yaiba.fandom.com/wiki/Demon_Slayer" target="_blank"
                  style="text-decoration: none;">Demon
                  Slayers</a> in the <a href="https://kimetsu-no-yaiba.fandom.com/wiki/Demon_Slayer_Corps"
                  target="_blank" style="text-decoration: none;">Demon Slayer Corps.</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!--Content-->
  <main class="container-fluid hashira-main mx-auto px-4 py-5">
    <div class="row row-cols-1 row-cols-xl-2 hashira-grid" id="hashira-list"></div>
  </main>

  <!--Footer-->
  <div class="container-fluid p-0 overflow-hidden">
    <div class="row">
      <div class="col">
        <div class="card rounded-0 text-white" style="height: 310px; background-color: #171717;">
          <div class="div text-center mt-4 ">
            <div class="div"><img src="img/Sticker 1.png" alt="" style="width: 160px;"></div>
            <div class="div">
              <h3 class="fw-semibold mb-5">Nine Pillars. One Mission. Destroy all demons</h2>
            </div>
            <div class="div">
              <p class="opacity-75 fw-light" style="font-size: 13px;">Designed by: Ryan Pol Austria Malabanan</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script> //dataset json
    const hashiraData = [
      { name: "Gyomei Himejima", title: "Stone Hashira (Iwa Hashira)", breathing: "Stone Breathing", quote: "A gentle, devout giant widely regarded as the strongest Hashira in the corps.", image: "img/Gyomei.jpg" },
      { name: "Sanemi Shinazugawa", title: "Wind Hashira (Kaze Hashira)", breathing: "Wind Breathing", quote: "An aggressive fighter with rare blood that intoxicates attacking demons.", image: "img/Sanemi.jpg" },
      { name: "Giyu Tomioka", title: "Water Hashira (Mizu Hashira)", breathing: "Water Breathing", quote: "A stoic and reserved swordsman who created the 11th Form: Dead Calm.", image: "img/Tomioka.jpg" },
      { name: "Obanai Iguro", title: "Serpent Hashira (Hebi Hashira)", breathing: "Serpent Breathing", quote: "A strict swordsman accompanied by Kaburamaru, his snake.", image: "img/Obanai.jpg" },
      { name: "Muichiro Tokito", title: "Mist Hashira (Kasumi Hashira)", breathing: "Mist Breathing", quote: "An absent-minded prodigy who reached Hashira rank in just two months.", image: "img/Muichiro.jpg" },
      { name: "Kyojuro Rengoku", title: "Flame Hashira (En Hashira)", breathing: "Flame Breathing", quote: "An enthusiastic, honorable warrior with a&nbsp;fierce passion to protect others.", image: "img/rengoku.jpg" },
      { name: "Mitsuri Kanroji", title: "Love Hashira (Koi Hashira)", breathing: "Love Breathing", quote: "A bubbly and affectionate warrior possessing superhuman muscle density.", image: "img/mitsuri.jpg" },
      { name: "Tengen Uzui", title: "Sound Hashira (Oto Hashira)", breathing: "Sound Breathing", quote: "A flamboyant former shinobi who battles with dual cleavers and explosives.", image: "img/tengen.jpg" },
      { name: "Shinobu Kocho", title: "Insect Hashira (Mushi Hashira)", breathing: "Insect Breathing", quote: "A cheerful strategist who uses custom wisteria poisons to defeat demons.", image: "img/Shinobu.jpg" }
    ];

    const list = document.getElementById("hashira-list");

    list.innerHTML = hashiraData.map(h => `
  <div class="col">
    <div class="card hashira-card h-100 overflow-hidden">
      <div class="d-flex flex-wrap align-items-center h-100">
        <img src="${h.image}" alt="${h.name}" class="hashira-photo mx-auto">
        <div class="hashira-info ps-4 pe-5 py-3">
          <h2 class="hashira-name mb-3">${h.name}</h2>
          <p>Title: ${h.title}</p>
          <p>Breathing Style: ${h.breathing}</p>
          <p>"${h.quote}"</p>
        </div>
      </div>
    </div>
  </div>`).join("");

  </script>
</body>

</html>
